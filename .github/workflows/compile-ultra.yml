name: Compile Ultra

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: OTA directory baked into this Ultra build
        type: choice
        options:
          - production
          - test
        default: production
  pull_request:
  push:
    paths-ignore:
      - "cdn/**"
      - "docs/**"
      - "modbus_mappings/**"
      - "*.md"

jobs:
  compile-ultra:
    name: Ultra 8MB firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Check Ultra compile config
        run: |
          python3 tools/test_compile_ultra.py
          python3 tools/test_sftp_ota.py

      - name: Compile Ultra and stage OTA files
        env:
          OTA_CHANNEL: ${{ github.event.inputs.ota_channel || 'production' }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$OTA_CHANNEL" = "test" ]; then
            extra+=(--test-channel)
          fi
          python3 tools/compile_ultra.py --out dist/ultra "${extra[@]}"

      - name: Upload Ultra OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultra-ota-${{ github.event.inputs.ota_channel || 'production' }}
          path: dist/ultra/*
          if-no-files-found: error

      - name: Show staged files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path("dist/ultra").iterdir()):
              print(f"{p.name}\t{p.stat().st_size}")
          PY

      # Skips (job stays green) unless these repo secrets exist:
      # OTA_SFTP_HOST, OTA_SFTP_USER, OTA_SFTP_PATH, and OTA_SFTP_KEY or OTA_SFTP_PASSWORD.
      # Optional: OTA_SFTP_PATH_TEST, OTA_SFTP_PORT.
      - name: Publish Ultra OTA over SFTP
        if: >-
          ${{
            secrets.OTA_SFTP_HOST != '' &&
            secrets.OTA_SFTP_USER != '' &&
            secrets.OTA_SFTP_PATH != '' &&
            (secrets.OTA_SFTP_KEY != '' || secrets.OTA_SFTP_PASSWORD != '')
          }}
        env:
          OTA_SFTP_HOST: ${{ secrets.OTA_SFTP_HOST }}
          OTA_SFTP_USER: ${{ secrets.OTA_SFTP_USER }}
          OTA_SFTP_PATH: ${{ secrets.OTA_SFTP_PATH }}
          OTA_SFTP_PATH_TEST: ${{ secrets.OTA_SFTP_PATH_TEST }}
          OTA_SFTP_PORT: ${{ secrets.OTA_SFTP_PORT }}
          OTA_SFTP_KEY: ${{ secrets.OTA_SFTP_KEY }}
          OTA_SFTP_PASSWORD: ${{ secrets.OTA_SFTP_PASSWORD }}
          OTA_CHANNEL: ${{ github.event.inputs.ota_channel || 'production' }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${OTA_SFTP_KEY}" ]; then
            key="$RUNNER_TEMP/ota_sftp_key"
            printf '%s\n' "$OTA_SFTP_KEY" > "$key"
            chmod 600 "$key"
            extra+=(--identity "$key")
          elif [ -n "${OTA_SFTP_PASSWORD}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          python3 tools/sftp_ota.py --dir dist/ultra --channel "$OTA_CHANNEL" "${extra[@]}"
          if [ -n "${key:-}" ]; then
            rm -f "$key"
          fi
